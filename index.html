<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>즐겨찾기 대시보드 | Favorite Site Dashboard</title>
    <meta name="description" content="자주 방문하는 사이트를 한눈에 관리하고 신속하게 접속하는 프리미엄 즐겨찾기 대시보드입니다.">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Main Stylesheet -->
    <link rel="stylesheet" href="styles.css">
</head>
<body class="dark-theme">
    <div class="app-container">
        <!-- Sidebar Navigation -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="logo-box">
                    <i class="fa-solid fa-bookmark logo-icon"></i>
                </div>
                <span class="logo-text">FavDash</span>
            </div>

            <nav class="sidebar-nav">
                <div class="nav-section-title">카테고리</div>
                <button class="nav-item active" data-category="all" id="cat-all">
                    <i class="fa-solid fa-layer-group"></i>
                    <span>전체보기</span>
                    <span class="badge" id="count-all">0</span>
                </button>
                <button class="nav-item" data-category="ai-dev" id="cat-ai-dev">
                    <i class="fa-solid fa-code"></i>
                    <span>AI & 개발</span>
                    <span class="badge" id="count-ai-dev">0</span>
                </button>
                <button class="nav-item" data-category="productivity" id="cat-productivity">
                    <i class="fa-solid fa-briefcase"></i>
                    <span>생산성 & 업무</span>
                    <span class="badge" id="count-productivity">0</span>
                </button>
                <button class="nav-item" data-category="design" id="cat-design">
                    <i class="fa-solid fa-palette"></i>
                    <span>디자인 & 미디어</span>
                    <span class="badge" id="count-design">0</span>
                </button>
                <button class="nav-item" data-category="community" id="cat-community">
                    <i class="fa-solid fa-comments"></i>
                    <span>뉴스 & 커뮤니티</span>
                    <span class="badge" id="count-community">0</span>
                </button>
                <button class="nav-item" data-category="pinned" id="cat-pinned">
                    <i class="fa-solid fa-star"></i>
                    <span>즐겨찾기 고정</span>
                    <span class="badge" id="count-pinned">0</span>
                </button>
            </nav>

            <div class="sidebar-footer">
                <button class="btn-theme-toggle" id="theme-toggle-btn" title="테마 변경">
                    <i class="fa-solid fa-moon" id="theme-icon"></i>
                    <span id="theme-text">다크 모드</span>
                </button>
            </div>
        </aside>

        <!-- Main Content Area -->
        <main class="main-content">
            <!-- Header Section -->
            <header class="top-header">
                <div class="greeting-box">
                    <h1 class="greeting-title" id="greeting-title">안녕하세요! 👋</h1>
                    <p class="greeting-subtitle" id="current-date-str">오늘도 효율적인 하루를 시작하세요.</p>
                </div>
                <div class="header-actions">
                    <button class="btn btn-secondary" id="btn-export" title="데이터 내보내기">
                        <i class="fa-solid fa-download"></i> 백업
                    </button>
                    <button class="btn btn-secondary" id="btn-import" title="데이터 가져오기">
                        <i class="fa-solid fa-upload"></i> 복원
                    </button>
                    <input type="file" id="import-file-input" accept=".json" style="display: none;">
                    <button class="btn btn-primary" id="btn-add-modal">
                        <i class="fa-solid fa-plus"></i> 새 사이트 추가
                    </button>
                </div>
            </header>

            <!-- Quick Search Bar & Search Engine Engine Toggle -->
            <section class="search-section">
                <div class="search-bar-container">
                    <div class="search-engine-selector" id="search-engine-selector">
                        <button class="engine-active" id="active-engine-btn">
                            <i class="fa-brands fa-google"></i>
                            <i class="fa-solid fa-chevron-down dropdown-arrow"></i>
                        </button>
                        <div class="engine-dropdown" id="engine-dropdown">
                            <div class="engine-option active" data-engine="google" data-icon="fa-brands fa-google" data-name="Google">
                                <i class="fa-brands fa-google"></i> Google
                            </div>
                            <div class="engine-option" data-engine="naver" data-icon="fa-solid fa-N" data-name="네이버">
                                <i class="fa-solid fa-bold"></i> 네이버
                            </div>
                            <div class="engine-option" data-engine="bing" data-icon="fa-brands fa-microsoft" data-name="Bing">
                                <i class="fa-brands fa-microsoft"></i> Bing
                            </div>
                            <div class="engine-option" data-engine="duckduckgo" data-icon="fa-solid fa-shield-halved" data-name="DuckDuckGo">
                                <i class="fa-solid fa-shield-halved"></i> DuckDuckGo
                            </div>
                        </div>
                    </div>
                    <div class="search-input-wrapper">
                        <i class="fa-solid fa-magnifying-glass search-icon"></i>
                        <input type="text" id="search-input" placeholder="사이트 검색 또는 Web 검색어 입력 (Enter로 검색)" autocomplete="off">
                        <button class="clear-search-btn" id="clear-search-btn" style="display: none;">
                            <i class="fa-solid fa-xmark"></i>
                        </button>
                    </div>
                    <div class="keyboard-shortcut-hint">
                        <kbd>/</kbd>
                    </div>
                </div>
            </section>

            <!-- Pinned Quick Access Bar -->
            <section class="pinned-section" id="pinned-section">
                <div class="section-header">
                    <h2><i class="fa-solid fa-bolt icon-accent"></i> 빠른 바로가기</h2>
                </div>
                <div class="pinned-grid" id="pinned-grid">
                    <!-- Dynamic Pinned Cards -->
                </div>
            </section>

            <!-- Site Grid List -->
            <section class="sites-section">
                <div class="section-header">
                    <h2 id="current-category-title">전체 사이트</h2>
                    <div class="sort-controls">
                        <label for="sort-select"><i class="fa-solid fa-arrow-down-short-wide"></i> 정렬:</label>
                        <select id="sort-select">
                            <option value="custom">사용자 지정</option>
                            <option value="name">이름순</option>
                            <option value="views">방문 횟수순</option>
                            <option value="newest">최근 추가순</option>
                        </select>
                    </div>
                </div>

                <div class="sites-grid" id="sites-grid">
                    <!-- Dynamic Site Cards rendered by JS -->
                </div>

                <!-- Empty State -->
                <div class="empty-state" id="empty-state" style="display: none;">
                    <div class="empty-icon"><i class="fa-solid fa-folder-open"></i></div>
                    <h3>등록된 사이트가 없습니다</h3>
                    <p>상단의 '새 사이트 추가' 버튼을 눌러 자주 방문하는 웹사이트를 등록해보세요.</p>
                    <button class="btn btn-primary" id="btn-add-empty">사이트 추가하기</button>
                </div>
            </section>
        </main>
    </div>

    <!-- Add / Edit Modal -->
    <div class="modal-overlay" id="site-modal" style="display: none;">
        <div class="modal-card">
            <div class="modal-header">
                <h3 id="modal-title"><i class="fa-solid fa-link"></i> 새 사이트 추가</h3>
                <button class="modal-close" id="modal-close-btn">&times;</button>
            </div>
            <form id="site-form">
                <input type="hidden" id="site-id">
                <div class="form-group">
                    <label for="site-title">사이트 이름 *</label>
                    <input type="text" id="site-title" placeholder="예: GitHub" required autocomplete="off">
                </div>
                <div class="form-group">
                    <label for="site-url">URL 주소 *</label>
                    <input type="url" id="site-url" placeholder="https://github.com" required autocomplete="off">
                </div>
                <div class="form-group">
                    <label for="site-category">카테고리</label>
                    <select id="site-category">
                        <option value="ai-dev">AI & 개발</option>
                        <option value="productivity">생산성 & 업무</option>
                        <option value="design">디자인 & 미디어</option>
                        <option value="community">뉴스 & 커뮤니티</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="site-desc">설명 (선택사항)</label>
                    <input type="text" id="site-desc" placeholder="예: 소스코드 저장소 및 버전 관리 플랫폼" autocomplete="off">
                </div>
                <div class="form-group">
                    <label for="site-tags">태그 (쉼표로 구분)</label>
                    <input type="text" id="site-tags" placeholder="개발, Git, Repository" autocomplete="off">
                </div>
                <div class="form-group checkbox-group">
                    <input type="checkbox" id="site-pinned">
                    <label for="site-pinned">상단 빠른 바로가기에 고정하기</label>
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn btn-secondary" id="modal-cancel-btn">취소</button>
                    <button type="submit" class="btn btn-primary" id="modal-submit-btn">저장</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Toast Notification -->
    <div class="toast" id="toast-notification"></div>

    <script src="app.js"></script>
</body>
</html>
